<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Los tres frentes del Diagnóstico de Madurez Profesional</title>
  <desc id="desc">Una empresa conectada con tres frentes de revisión: procesos, estructura organizacional y control interno.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d416b"/>
      <stop offset="1" stop-color="#153252"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e4edf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071a2d" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="892" height="492" rx="20" fill="url(#background)" stroke="#fff" stroke-opacity=".16"/>

  <!-- Empresa como punto de conexión -->
  <text x="460" y="43" text-anchor="middle" fill="#e9bd74" font-family="Source Sans 3, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">DIAGNÓSTICO DE MADUREZ PROFESIONAL</text>
  <circle cx="460" cy="124" r="49" fill="url(#hub)" filter="url(#shadow)"/>
  <g fill="none" stroke="#17385f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M438 143v-33l22-14 22 14v33z"/>
    <path d="M447 143v-17h10v17m7 0v-25h10v25m-31 0h39"/>
  </g>
  <text x="460" y="163" text-anchor="middle" fill="#17385f" font-family="Source Sans 3, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">TU EMPRESA</text>

  <!-- Conectores -->
  <g fill="none" stroke="#e2ad58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M460 174v34M170 208h580M170 208v42m290-42v42m290-42v42"/>
  </g>
  <g fill="#e2ad58"><circle cx="170" cy="208" r="4"/><circle cx="460" cy="208" r="4"/><circle cx="750" cy="208" r="4"/></g>

  <!-- Tarjetas -->
  <g filter="url(#shadow)">
    <rect x="35" y="250" width="270" height="202" rx="14" fill="#fff" fill-opacity=".075" stroke="#fff" stroke-opacity=".25"/>
    <rect x="325" y="250" width="270" height="202" rx="14" fill="#fff" fill-opacity=".075" stroke="#fff" stroke-opacity=".25"/>
    <rect x="615" y="250" width="270" height="202" rx="14" fill="#fff" fill-opacity=".075" stroke="#fff" stroke-opacity=".25"/>
  </g>
  <g fill="#e9bd74" font-family="Source Sans 3, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">
    <text x="58" y="279">01</text><text x="348" y="279">02</text><text x="638" y="279">03</text>
  </g>

  <!-- Procesos: secuencia de trabajo -->
  <g fill="none" stroke="#e9bd74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="112" y="294" width="30" height="24" rx="5"/><rect x="157" y="294" width="30" height="24" rx="5"/><rect x="202" y="294" width="30" height="24" rx="5"/>
    <path d="M142 306h15m30 0h15m-18-4 4 4-4 4m-30-8 4 4-4 4"/>
  </g>
  <text x="170" y="363" text-anchor="middle" fill="#fff" font-family="Source Serif 4, Georgia, serif" font-size="22" font-weight="600">Procesos</text>
  <text x="170" y="389" text-anchor="middle" fill="#d5e1ef" font-family="Source Sans 3, Arial, sans-serif" font-size="14">Flujo y consistencia del trabajo</text>

  <!-- Estructura: roles y coordinación -->
  <g fill="none" stroke="#e9bd74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="445" y="290" width="30" height="22" rx="5"/><rect x="408" y="324" width="27" height="21" rx="5"/><rect x="455" y="324" width="27" height="21" rx="5"/><rect x="502" y="324" width="27" height="21" rx="5"/>
    <path d="M460 312v7m-38 0h76m-76 0v5m38-5v5m38-5v5"/>
  </g>
  <text x="460" y="378" text-anchor="middle" fill="#fff" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="600">Estructura organizacional</text>
  <text x="460" y="404" text-anchor="middle" fill="#d5e1ef" font-family="Source Sans 3, Arial, sans-serif" font-size="14">Funciones y coordinación</text>

  <!-- Control interno: resguardo y seguimiento -->
  <g fill="none" stroke="#e9bd74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M750 287 775 296v19c0 17-11 28-25 35-14-7-25-18-25-35v-19z"/>
    <path d="m739 314 8 8 15-17"/>
  </g>
  <text x="750" y="378" text-anchor="middle" fill="#fff" font-family="Source Serif 4, Georgia, serif" font-size="21" font-weight="600">Control interno</text>
  <text x="750" y="404" text-anchor="middle" fill="#d5e1ef" font-family="Source Sans 3, Arial, sans-serif" font-size="14">Seguimiento y cuidado</text>

  <text x="460" y="480" text-anchor="middle" fill="#c2d2e3" font-family="Source Sans 3, Arial, sans-serif" font-size="12" letter-spacing=".3">Tres perspectivas que se conectan en la operación diaria</text>
</svg>
